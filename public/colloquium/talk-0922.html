<script>
const TALKS = [{"no": 1, "date": "2026-09-01", "lang": "Korean", "mode": "Offline", "speaker": "Myounghoon Jeon (전명훈)", "affil": "Virginia Tech · Professor", "title": "", "abstract": "", "bio": "", "photo": "speakers/jeon-myounghoon.jpg"}, {"no": 2, "date": "2026-09-08", "lang": "", "mode": "", "speaker": "", "affil": "", "title": "", "abstract": "", "bio": ""}, {"no": 3, "date": "2026-09-15", "lang": "English/Korean", "mode": "Offline", "speaker": "Namwoo Kang (강남우)", "affil": "KAIST · Associate Professor / Narnia Labs CEO", "title": "제조업 설계 AX의 도전과 미래", "abstract": "최근 비약적으로 발전한 AI 기술은 전통적인 제품 개발 프로세스의 근본적인 전환을 촉진하고 있다. 특히 AI가 높은 자율성을 바탕으로 설계 업무를 수행하는 Agentic AI 기반의 자율 설계 시대가 본격화되면서, 제품 개발의 방식과 속도뿐만 아니라 조직의 의사결정 구조 및 문화 전반에도 큰 변화를 요구하고 있다. 본 세미나에서는 실제 제조 산업의 제품 설계 분야에 적용된 다양한 AX 성공 사례를 소개한다. 또한 이러한 기술을 기반으로 창업에 도전하는 과정에서 마주한 현실적인 어려움과 치열한 글로벌 경쟁의 현장을 함께 공유하고자 한다.", "bio": "", "photo": "speakers/kang-namwoo.jpg"}, {"no": 4, "date": "2026-09-22", "lang": "Korean", "mode": "Offline", "speaker": "이상우", "affil": "Inha University · Visiting Professor", "title": "AI 에이전트는 어디까지 대신할 수 있을까? — Agentic AI의 기술, 위험, 그리고 새로운 규칙", "abstract": "AI Agent는 기존 생성형 AI와 다른 차원의 문제를 제기한다. 생성형 AI의 주요 위험이 허위정보, 편향, 저작권 침해 등 출력물의 문제에 있었다면, AI Agent의 위험은 파일 삭제, 계정 변경, 데이터 전송, 결제, 계약, 시스템 조작 등 실행행위의 문제로 확장된다. 이는 AI가 “무엇을 말했는가”뿐 아니라 “무엇을 실행했는가”가 중요한 쟁점이 되고 있다. 이번 특강에서는 AI Agent가 왜 새로운 법적·윤리적·정책적 규율을 요구하는지 살펴본다. 아울러 최근 미국·중국의 입법 동향과 한국의 관련 논의를 함께 검토한다.", "bio": "", "photo": "speakers/lee-sangwoo.jpg"}, {"no": 5, "date": "2026-09-29", "lang": "", "mode": "", "speaker": "", "affil": "", "title": "", "abstract": "", "bio": ""}, {"no": 6, "date": "2026-10-06", "lang": "English", "mode": "Offline", "speaker": "Sungsoo Ahn (안성수)", "affil": "KAIST · Assistant Professor", "title": "AI for Molecular and Materials Discovery", "abstract": "Can artificial intelligence help us discover new drugs and materials? In this talk, I will introduce the emerging field of AI for molecular and materials discovery. I will explain how machine learning can predict the structures and properties of molecules, proteins, and materials, and how generative models can propose new candidates with desired functions. I will also discuss a central challenge of the field: predictions that look promising in computation do not always succeed in real experiments. Finally, I will briefly introduce emerging directions such as virtual cells and AI scientists, which aim to connect computational models with experimental discovery.", "bio": "Sungsoo Ahn is an Assistant Professor at the Graduate School of AI at KAIST, where he leads the Structured and Probabilistic Machine Learning Lab. His research focuses on developing machine learning methods for molecular and materials science, including drug discovery, protein modeling, crystal and materials generation, atomistic simulation, and quantum-mechanical prediction. More broadly, he is interested in building AI systems that can support scientific discovery by combining structured learning, physical modeling, and generative methods.", "photo": "speakers/ahn-sungsoo.jpg"}, {"no": 7, "date": "2026-10-13", "lang": "Korean", "mode": "Offline", "speaker": "Young Yik Rhim (임영익)", "affil": "Intellicon · CEO", "title": "생성형ai와 도망자들", "abstract": "", "bio": "", "photo": "speakers/rhim-youngyik.jpg"}, {"special": "Midterm week — no colloquium", "date": "2026-10-20"}, {"no": 8, "date": "2026-10-27", "lang": "English", "mode": "Offline", "speaker": "Kangwook Lee (이강욱)", "affil": "KRAFTON · Chief AI Officer", "title": "AI Agents Across Digital and Physical Worlds: From Games to Robots", "abstract": "", "bio": "", "photo": "speakers/lee-kangwook.jpg"}, {"no": 9, "date": "2026-11-03", "lang": "English", "mode": "Offline", "speaker": "Jinheon Baek (백진헌)", "affil": "KAIST · Research Fellow", "title": "From Knowledge to Discovery: Agentic AI for the Full Research Workflow", "abstract": "Foundation models are stateless functions whose behavior is governed by the context they receive. When models could not hold the knowledge of the world in their parameters, the central challenge was recall: grounding them in external sources through retrieval and verification was necessary for reliable answers. As models have become far more capable, the challenge is no longer only to recall what the world already knows, but to discover what it does not yet know. This talk traces that shift from knowledge to discovery: from retrieving and verifying what is already known across heterogeneous sources (including literature, databases, and knowledge graphs) to agentic systems that generate ideas, implement experiments, and evaluate outcomes across the full research workflow to produce what is not.", "bio": "Jinheon Baek is a Research Fellow at KAIST, and he recently received his Ph.D. in AI from KAIST in 2026. His research focuses on machine learning for language and knowledge, particularly on contextualizing foundation models over heterogeneous knowledge sources through unified retrieval and verification, and on extending such grounded models toward agentic AI that accelerates scientific discovery across the end-to-end research workflow. He has previously interned at Google DeepMind, IBM Research, Microsoft Research, and Amazon. His research is supported by the Sejong Science Fellowship and was supported by the Presidential Science Scholarship.", "photo": "speakers/baek-jinheon.jpg"}, {"no": 10, "date": "2026-11-10", "lang": "Korean", "mode": "Offline", "speaker": "Youngok Kim (김영옥)", "affil": "HD Hyundai · Chief AI Officer", "title": "", "abstract": "", "bio": "", "photo": "speakers/kim-youngok.jpg"}, {"no": 11, "date": "2026-11-17", "lang": "Korean", "mode": "Offline", "speaker": "Hyeonah Kim (김현아)", "affil": "UNIST · Assistant Professor", "title": "Searching Complex Design Spaces with AI", "abstract": "Many scientific and engineering problems require searching over large spaces of structured objects. In many real-world applications, the number of possible candidates is enormous, and evaluating each candidate can be expensive or time-consuming. This talk explores structured discovery as a unifying view of generative modeling, reinforcement learning, local and evolutionary search, and combinatorial optimization. Through examples from molecular design and combinatorial optimization, I will discuss how these methods can be combined to explore complex spaces efficiently, while addressing limited feedback, solution diversity, and the gap between computational objectives and real-world success.", "bio": "Hyeonah Kim is an Assistant Professor in the Department of Industrial Engineering at UNIST, with a joint appointment in the Graduate School of Artificial Intelligence. Her research focuses on machine learning for structured decision-making and discovery, with applications in combinatorial optimization, molecular design, and other scientific and engineering domains. More broadly, she is interested in building AI systems that combine learning, generation, and search to efficiently explore complex structured spaces. Before joining UNIST, she was a postdoctoral researcher at Mila – Québec AI Institute and the Université de Montréal.", "photo": "speakers/kim-hyeonah.jpg"}, {"no": null, "date": "2026-11-24", "lang": "", "mode": "", "speaker": "", "affil": "", "title": "", "abstract": "", "bio": ""}, {"no": 12, "date": "2026-12-01", "lang": "English", "mode": "Offline", "speaker": "Rosa Arriaga", "affil": "Georgia Tech · Associate Professor", "title": "Ecological AI for Health and Wellness", "abstract": "", "bio": "", "photo": "speakers/arriaga-rosa.jpg"}];

  return '<img class="avatar' + (cls ? " " + cls : "") + '" src="' + t.photo +
         '" alt="" width="320" height="320" decoding="async">';
}

// 연사 줄. 사진이 없으면 기존 한 줄 표기를 그대로 쓴다.
function bylineHtml(t) {
  if (!t.photo) {
    return t.title
      ? '<p class="d-speaker"><b>' + esc(t.speaker) + '</b>' + (t.affil ? ' · ' + esc(t.affil) : '') + '</p>'
      : '<p class="d-speaker">' + (t.affil ? esc(t.affil) + ' · ' : '') + 'Title TBA</p>';
  }
  const lines = t.title
    ? '<b>' + esc(t.speaker) + '</b>' + (t.affil ? '<span class="affil">' + esc(t.affil) + '</span>' : '')
    : (t.affil ? '<b>' + esc(t.affil) + '</b>' : '') + '<span class="affil">Title TBA</span>';
  return '<div class="byline">' + avatarHtml(t, "avatar-lg") +
         '<p class="d-speaker">' + lines + '</p></div>';
}

function card(t) {
  const d = D(t.date);
  const meta = '<span class="d-date-text">' + MONTH_FULL[d.getMonth()] + " " + d.getDate() +
    ", " + d.getFullYear() + '</span>' + tagsHtml(t);
  const heading = (t.title
      ? '<h2 class="d-title">' + esc(t.title) + '</h2>'
      : '<h2 class="d-title">' + esc(t.speaker) + '</h2>') + bylineHtml(t);
  const blocks =
    (t.abstract ? '<div class="d-block"><h4>Abstract</h4><p>' + esc(t.abstract) + '</p></div>' : '') +
    (t.bio ? '<div class="d-block"><h4>Bio</h4><p>' + esc(t.bio) + '</p></div>' : '');
  return '<section class="card"><div class="tags d-meta">' + meta + '</div>' +
    heading + blocks + '</section>';
}

if (t) {
  let pn = "";
  const prev = i > 0
    ? '<a class="prev-slot" href="talk-' + tid(detailed[i-1]) + '.html"><span class="chev-l" aria-hidden="true"></span>Previous talk</a>' : "";
  const next = i < detailed.length - 1
    ? '<a class="next-slot" href="talk-' + tid(detailed[i+1]) + '.html">Next talk<span class="chev-r" aria-hidden="true"></span></a>' : "";
  if (prev || next) pn = '<nav class="pn">' + prev + next + '</nav>';
  document.getElementById("talk").innerHTML = card(t) + pn;
  document.title = (t.title || t.speaker) + " — KAIST AI College Colloquium";
} else {
  document.getElementById("talk").innerHTML =
    '<section class="card"><p class="d-speaker">Talk not found. <a href="talks.html">See all talk descriptions</a>.</p></section>';
}
</script>
</body>
</html>
